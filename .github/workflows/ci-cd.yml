name: CI/CD - Build, Test & Push

# Déclenché à chaque push sur main (déploiement) et à chaque pull request
# ciblant main (validation, sans publication d'image).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: metrics-agent

jobs:
  # ---------------------------------------------------------------------
  # Job 1 : Test — exécute la suite pytest du projet.
  # Ce job tourne pour tout push ET toute pull request. S'il échoue, le
  # job "build-and-push" ne se déclenche jamais (voir `needs: test`).
  # ---------------------------------------------------------------------
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Installation des dépendances
        run: pip install -r requirements.txt

      - name: Exécution de la suite pytest
        run: pytest -v

  # ---------------------------------------------------------------------
  # Job 2 : Build & push — construit l'image de production et la publie
  # sur Docker Hub avec deux tags (latest + SHA du commit).
  #
  # Conditions :
  #   - needs: test            -> ne se lance QUE si les tests ont réussi
  #   - if: push sur main       -> jamais sur une pull request, pour ne
  #                                jamais exposer les secrets Docker Hub
  #                                à du code externe non revu.
  # ---------------------------------------------------------------------
  build-and-push:
    name: Build & push Docker image
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build et push de l'image de production
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
